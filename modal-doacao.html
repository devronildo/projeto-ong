<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Modal de Doação — Exemplo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="container">
<h1>Exemplo: Modal de Doação (JS + CSS + HTML)</h1>
<p>Abra a modal clicando no botão abaixo.</p>


<a href="#" class="btn" id="openModal">Fazer doação</a>
</main>


<div class="overlay" id="modalOverlay" aria-hidden="true">
<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1">
<header>
<h2 id="dialogTitle">Faça sua doação</h2>
<button class="close-btn" id="closeModal" aria-label="Fechar janela">✕</button>
</header>


<div class="content">
<p>Ajude nossa causa escolhendo um valor abaixo ou digitando um valor.</p>


<div class="donation-row" role="radiogroup" aria-label="Valores de doação">
<button type="button" data-amount="25">R$25</button>
<button type="button" data-amount="50">R$50</button>
<button type="button" data-amount="100">R$100</button>
<input type="number" id="customAmount" placeholder="Outro valor (R$)" min="1" style="flex: 1 1 100%; padding: .6rem; border-radius: 8px; border: 1px solid #e6e9f2; margin-top: .5rem;">
</div>


<div class="actions">
<button class="primary" id="confirmDonate">Confirmar doação</button>
<button class="secondary" id="cancelDonate">Cancelar</button>
</div>


<p style="font-size: .9rem; color: #666; margin-top: .75rem;">Pressione <kbd>Esc</kbd> para fechar a janela.</p>
</div>
</div>
</div>


<script src="script.js"></script>
</body>
</html>
